<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Tre Immagini Casuali - Cambio con setTimeout</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .container {
        background: white;
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      }

      h1 {
        text-align: center;
        color: #333;
        margin-bottom: 30px;
        font-size: 28px;
      }

      .gallery {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 30px;
        flex-wrap: wrap;
      }

      .gallery-item img {
        width: 200px;
        height: 200px;
        object-fit: contain;
        border-radius: 15px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        background: #f5f5f5;
        padding: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1 id="tit">🎲 Immagini Casuali 🎲</h1>

      <div class="gallery" id="gallery">
        <div class="gallery-item">
          <img src="1.png" alt="Immagine 1" class="foto" />
        </div>

        <div class="gallery-item">
          <img src="2.png" alt="Immagine 2" class="foto" />
        </div>

        <div class="gallery-item">
          <img src="3.png" alt="Immagine 3" class="foto" />
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>

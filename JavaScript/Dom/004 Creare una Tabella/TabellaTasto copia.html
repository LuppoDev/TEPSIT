<!doctype html>
<html>
  <head>
    <title>Generatore dinamico di tabella</title>
  </head>
  <body>
    <label style="display: block; padding: 20px 0px 0px 0px">
      Numero di righe:
      <input type="number" id="righe" value="1" min="1" />
    </label>

    <br />

    <label style="display: block; padding: 10px 0px 0px 0px">
      Numero di colonne:
      <input type="number" id="colonne" value="1" min="1" />
    </label>

    <!-- Container dove verrà inserita la tabella -->
    <div id="container" style="padding: 10px 0px"></div>
    <script src="script.js"></script>
  </body>
</html>
